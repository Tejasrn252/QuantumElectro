<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <style>
    .bg{fill:#0f172a}
    .card{fill:url(#g);rx:12}
    .pulse{fill:#fff;opacity:0.06}
    .dot{fill:#fff;opacity:0.9}
    .title{fill:#fff;font-family:Inter,Segoe UI,Arial;font-weight:700;font-size:28px}
    .sub{fill:#e6eefb;opacity:0.9;font-size:14px}
    .rect{fill:#ffffff;opacity:0.06}
    @keyframes slide {
      0% { transform: translateX(0);} 
      50% { transform: translateX(-8px);} 
      100% { transform: translateX(0);} 
    }
    .animate {animation: slide 2.6s ease-in-out infinite}
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="60%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" class="bg" rx="8"/>
  <g transform="translate(56,32)" class="animate">
    <rect width="788" height="256" rx="12" fill="url(#g)" />
    <g transform="translate(28,24)">
      <text class="title">QuantumElectro — Demo</text>
      <text x="0" y="36" class="sub">Hover and interactions simulated — product cards, cart flow</text>
      <g transform="translate(0,72)">
        <rect x="0" y="0" width="120" height="80" rx="8" class="rect" />
        <rect x="140" y="0" width="120" height="80" rx="8" class="rect" />
        <rect x="280" y="0" width="120" height="80" rx="8" class="rect" />
        <rect x="420" y="0" width="120" height="80" rx="8" class="rect" />
        <rect x="560" y="0" width="120" height="80" rx="8" class="rect" />
      </g>
      <g transform="translate(0,168)">
        <rect x="0" y="0" width="520" height="40" rx="8" fill="#ffffff" opacity="0.08"/>
        <rect x="540" y="0" width="116" height="40" rx="8" fill="#ffffff" opacity="0.14"/>
      </g>
    </g>
  </g>
</svg>